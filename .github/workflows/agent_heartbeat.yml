name: AI Trading Agent Heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run agent heartbeat
        env:
          PAPER_TRADING: "true"
          REAL_ORDER: "false"
        run: |
          python -c "from app import app; r=app.test_client().get('/api/analyze'); print('HTTP_STATUS:', r.status_code); print(r.get_data(as_text=True)); raise SystemExit(0 if r.status_code == 200 else 1)"
