name: AI Trading Agent Heartbeat

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-trading-agent-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 6

    env:
      PAPER_TRADING: "true"
      REAL_ORDER: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare state directory
        run: |
          mkdir -p .agent_state

      - name: Restore agent state
        id: restore-state
        uses: actions/cache/restore@v6
        with:
          path: .agent_state
          key: ai-agent-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ai-agent-state-${{ github.ref_name }}-

      - name: Run heartbeat
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          from app import (
              agent,
              PAPER_TRADING,
              REAL_ORDER_ENABLED,
              get_okx_live_candles,
              calculate_verified_features,
          )

          STATE_DIR = Path(".agent_state")
          STATE_FILE = STATE_DIR / "agent_state.json"
          JOURNAL_FILE = Path("TRADE_JOURNAL.md")

          STATE_VERSION = 4
          ACCEPTED_STATE_VERSIONS = {3, 4}

          REQUIRED_STATE_KEYS = {
              "status",
              "position",
              "last_signal",
              "last_timestamp",
          }

          MARKET = "BTC-USDT"
          TIMEFRAME = "15m"

          def fail(message):
              raise RuntimeError(message)

          def parse_timestamp(value):
              if value is None:
                  return None

              ts = pd.to_datetime(
                  value,
                  errors="coerce",
              )

              if pd.isna(ts):
                  return None

              ts = pd.Timestamp(ts)

              if ts.tzinfo is not None:
                  ts = ts.tz_localize(None)

              return ts

          def normalize_position(position):
              if not isinstance(position, dict):
                  return position

              position = dict(position)

              if "entry_timestamp" in position:
                  parsed = parse_timestamp(
                      position["entry_timestamp"]
                  )

                  if parsed is not None:
                      position["entry_timestamp"] = parsed

              return position

          def trade_id_from_position(position):
              if not position:
                  return None

              side = position.get("position")

              entry_timestamp = parse_timestamp(
                  position.get("entry_timestamp")
              )

              if side is None or entry_timestamp is None:
                  return None

              return (
                  f"{MARKET}-{side}-"
                  f"{entry_timestamp.strftime('%Y%m%d-%H%M%S')}"
              )

          def fmt(value):
              if value is None:
                  return ""

              if isinstance(value, float):
                  return (
                      f"{value:.10f}"
                      .rstrip("0")
                      .rstrip(".")
                  )

              return str(value)

          def ensure_journal():
              if JOURNAL_FILE.exists():
                  return

              JOURNAL_FILE.write_text(
                  "# AI Trading Agent — Trade Journal\n\n"
                  "## Trades\n\n"
                  "| Trade ID | Side | Entry Time | Entry Price | "
                  "Initial SL | TP | Exit Time | Exit Price | "
                  "Exit Reason | R | Bars Held | Status | Mode |\n"
                  "|---|---|---|---:|---:|---:|---|---:|---|---:|---:|---|---|\n",
                  encoding="utf-8",
              )

          def read_journal():
              ensure_journal()

              return JOURNAL_FILE.read_text(
                  encoding="utf-8"
              )

          def journal_has_trade(trade_id):
              if not trade_id:
                  return False

              content = read_journal()

              for line in content.splitlines():
                  if line.startswith("|") and trade_id in line:
                      return True

              return False

          def append_entry(position, source="SIGNAL"):
              trade_id = trade_id_from_position(position)

              if not trade_id:
                  fail(
                      "Cannot create Trade ID from position."
                  )

              if journal_has_trade(trade_id):
                  return False

              side = position.get("position")

              entry_timestamp = parse_timestamp(
                  position.get("entry_timestamp")
              )

              mode = "REAL" if REAL_ORDER_ENABLED else "PAPER"

              row = (
                  f"| {trade_id} | "
                  f"{side or ''} | "
                  f"{entry_timestamp.isoformat() if entry_timestamp is not None else ''} | "
                  f"{fmt(position.get('entry'))} | "
                  f"{fmt(position.get('initial_sl'))} | "
                  f"{fmt(position.get('tp'))} | "
                  f" | "
                  f" | "
                  f" | "
                  f" | "
                  f"{fmt(position.get('bars_held', 0))} | "
                  f"OPEN | "
                  f"{mode} |"
              )

              with JOURNAL_FILE.open(
                  "a",
                  encoding="utf-8",
              ) as f:
                  f.write("\n")
                  f.write(row)
                  f.write("\n")
                  f.write(
                      f"<!-- ENTRY_SOURCE:{source} "
                      f"TRADE_ID:{trade_id} -->\n"
                  )

              print(
                  f"JOURNAL ENTRY ADDED: {trade_id}"
              )

              return True

          def update_exit(position):
              trade_id = trade_id_from_position(position)

              if not trade_id:
                  fail(
                      "Cannot create Trade ID for EXIT."
                  )

              content = read_journal()

              if not journal_has_trade(trade_id):
                  append_entry(
                      position,
                      source="EXIT_BOOTSTRAP",
                  )
                  content = read_journal()

              exit_timestamp = parse_timestamp(
                  position.get("exit_timestamp")
              )

              exit_price = position.get(
                  "exit_price"
              )

              entry = position.get(
                  "entry"
              )

              risk = position.get(
                  "risk"
              )

              side = position.get(
                  "position"
              )

              r_value = None

              if (
                  exit_price is not None
                  and entry is not None
                  and risk is not None
                  and float(risk) != 0
              ):
                  if side == "LONG":
                      r_value = (
                          float(exit_price)
                          - float(entry)
                      ) / float(risk)

                  elif side == "SHORT":
                      r_value = (
                          float(entry)
                          - float(exit_price)
                      ) / float(risk)

              lines = content.splitlines()

              for i, line in enumerate(lines):

                  if not line.startswith("|"):
                      continue

                  if trade_id not in line:
                      continue

                  if line.startswith("| Trade ID"):
                      continue

                  if line.startswith("|---"):
                      continue

                  parts = line.split("|")

                  if len(parts) < 14:
                      continue

                  parts[7] = (
                      f" "
                      f"{exit_timestamp.isoformat() if exit_timestamp is not None else ''}"
                      f" "
                  )

                  parts[8] = (
                      f" {fmt(exit_price)} "
                  )

                  parts[9] = (
                      f" {position.get('exit_reason', '')} "
                  )

                  parts[10] = (
                      f" {fmt(r_value)} "
                  )

                  parts[11] = (
                      f" {fmt(position.get('bars_held'))} "
                  )

                  parts[12] = " CLOSED "

                  lines[i] = "|".join(parts)

                  JOURNAL_FILE.write_text(
                      "\n".join(lines) + "\n",
                      encoding="utf-8",
                  )

                  print(
                      f"JOURNAL EXIT UPDATED: {trade_id}"
                  )

                  return True

              return False

          print("=" * 60)
          print("AI TRADING AGENT HEARTBEAT")
          print("=" * 60)

          print(
              f"PAPER_TRADING       : {PAPER_TRADING}"
          )

          print(
              f"REAL_ORDER_ENABLED  : {REAL_ORDER_ENABLED}"
          )

          if PAPER_TRADING is not True:
              fail(
                  "Safety stop: PAPER_TRADING must remain True."
              )

          if REAL_ORDER_ENABLED is not False:
              fail(
                  "Safety stop: REAL_ORDER_ENABLED must remain False."
              )

          STATE_DIR.mkdir(
              parents=True,
              exist_ok=True,
          )

          state_loaded = False

          if STATE_FILE.exists():

              try:
                  saved = json.loads(
                      STATE_FILE.read_text(
                          encoding="utf-8"
                      )
                  )

                  version = saved.get(
                      "version"
                  )

                  saved_agent = saved.get(
                      "agent"
                  )

                  if (
                      version in ACCEPTED_STATE_VERSIONS
                      and isinstance(saved_agent, dict)
                      and REQUIRED_STATE_KEYS.issubset(
                          saved_agent.keys()
                      )
                  ):

                      agent.status = saved_agent.get(
                          "status",
                          "READY",
                      )

                      agent.position = normalize_position(
                          saved_agent.get(
                              "position"
                          )
                      )

                      agent.last_signal = saved_agent.get(
                          "last_signal"
                      )

                      agent.last_decision = saved_agent.get(
                          "last_decision"
                      )

                      agent.last_timestamp = parse_timestamp(
                          saved_agent.get(
                              "last_timestamp"
                          )
                      )

                      state_loaded = True

                      print(
                          f"STATE RESTORED: version {version}"
                      )

                      print(
                          f"RESTORED STATUS    : {agent.status}"
                      )

                      print(
                          f"RESTORED POSITION  : "
                          f"{agent.position}"
                      )

                      print(
                          f"RESTORED TIMESTAMP : "
                          f"{agent.last_timestamp}"
                      )

                  else:
                      print(
                          "STATE REBUILD: invalid or incomplete state"
                      )

              except Exception as exc:
                  print(
                      "STATE REBUILD: "
                      f"{type(exc).__name__}: {exc}"
                  )

          else:
              print(
                  "STATE MISSING: rebuild required"
              )

          candles = get_okx_live_candles()

          if candles is None or len(candles) == 0:
              fail(
                  "No candles returned from OKX."
              )

          candles = candles.copy()

          if "timestamp" not in candles.columns:
              fail(
                  "Missing timestamp column."
              )

          candles["timestamp"] = pd.to_datetime(
              candles["timestamp"],
              errors="coerce",
          )

          candles = candles.dropna(
              subset=["timestamp"]
          )

          candles = (
              candles
              .sort_values("timestamp")
              .drop_duplicates(
                  subset=["timestamp"],
                  keep="last",
              )
              .reset_index(drop=True)
          )

          if len(candles) < 20:
              fail(
                  "Not enough candle data."
              )

          now = pd.Timestamp.now(
              "UTC"
          ).tz_localize(None)

          latest_timestamp = parse_timestamp(
              candles["timestamp"].iloc[-1]
          )

          if latest_timestamp is None:
              fail(
                  "Latest candle timestamp is invalid."
              )

          age_minutes = (
              now - latest_timestamp
          ).total_seconds() / 60.0

          print(
              f"RAW CANDLES         : {len(candles)}"
          )

          print(
              f"LATEST CANDLE       : {latest_timestamp}"
          )

          print(
              f"DATA AGE MINUTES    : {age_minutes:.2f}"
          )

          if age_minutes > 45:
              fail(
                  "Safety stop: latest confirmed data is too old."
              )

          features = calculate_verified_features(
              candles
          )

          if features is None or len(features) == 0:
              fail(
                  "Feature engine returned no data."
              )

          required_features = {
              "timestamp",
              "Signal_V2",
              "ADX",
              "RSI14",
              "ATR14",
              "close",
          }

          missing = (
              required_features
              - set(features.columns)
          )

          if missing:
              fail(
                  "Missing required feature columns: "
                  f"{sorted(missing)}"
              )

          features["timestamp"] = pd.to_datetime(
              features["timestamp"],
              errors="coerce",
          )

          features = (
              features
              .dropna(
                  subset=["timestamp"]
              )
              .sort_values("timestamp")
              .drop_duplicates(
                  subset=["timestamp"],
                  keep="last",
              )
              .reset_index(drop=True)
          )

          numeric_columns = [
              "close",
              "ADX",
              "RSI14",
              "ATR14",
          ]

          for col in numeric_columns:
              features[col] = pd.to_numeric(
                  features[col],
                  errors="coerce",
              )

          warmup_rows = len(features)

          features = features.dropna(
              subset=numeric_columns
          ).reset_index(drop=True)

          removed_warmup_rows = (
              warmup_rows - len(features)
          )

          print(
              f"FEATURE WARMUP REMOVED: "
              f"{removed_warmup_rows}"
          )

          if len(features) == 0:
              fail(
                  "No valid feature rows remain "
                  "after indicator warm-up."
              )

          for col in numeric_columns:

              if not features[col].map(
                  lambda x:
                      pd.notna(x)
                      and pd.api.types.is_number(x)
                      and pd.api.types.isfinite(x)
              ).all():

                  fail(
                      f"Non-finite or invalid values remain in {col}."
                  )

          earliest_timestamp = parse_timestamp(
              features["timestamp"].iloc[0]
          )

          latest_confirmed = parse_timestamp(
              features["timestamp"].iloc[-1]
          )

          if (
              earliest_timestamp is None
              or latest_confirmed is None
          ):
              fail(
                  "Invalid feature timestamps."
              )

          print(
              f"FEATURE WINDOW      : "
              f"{earliest_timestamp} -> "
              f"{latest_confirmed}"
          )

          last_timestamp = parse_timestamp(
              agent.last_timestamp
          )

          if (
              state_loaded
              and last_timestamp is not None
          ):

              if last_timestamp < earliest_timestamp:

                  if agent.position is not None:
                      fail(
                          "Safety stop: open position is older "
                          "than available confirmed data. "
                          "Manual reconciliation required."
                      )

                  print(
                      "STATE TOO OLD: safe rebuild "
                      "because no open position."
                  )

                  agent.position = None
                  agent.last_signal = None
                  agent.last_decision = None
                  agent.last_timestamp = None
                  agent.status = "READY"

                  state_loaded = False

          if (
              state_loaded
              and last_timestamp is not None
          ):

              pending = features[
                  features["timestamp"] > last_timestamp
              ].copy()

              mode = "INCREMENTAL"

          else:

              pending = features.copy()

              mode = "REBUILD"

          print(
              f"PROCESSING MODE     : {mode}"
          )

          print(
              f"PENDING CANDLES     : {len(pending)}"
          )

          if len(pending) > 0:

              expected_step = pd.Timedelta(
                  minutes=15
              )

              previous_timestamp = (
                  last_timestamp
              )

              for _, row in pending.iterrows():

                  current_timestamp = parse_timestamp(
                      row["timestamp"]
                  )

                  if current_timestamp is None:
                      fail(
                          "Invalid pending candle timestamp."
                      )

                  if previous_timestamp is not None:

                      delta = (
                          current_timestamp
                          - previous_timestamp
                      )

                      if delta != expected_step:

                          fail(
                              "Safety stop: irregular or "
                              "missing 15m candle sequence. "
                              f"Previous={previous_timestamp}, "
                              f"Current={current_timestamp
