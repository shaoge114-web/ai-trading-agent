name: AI Trading Agent Heartbeat

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-trading-agent-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 6

    env:
      PAPER_TRADING: "true"
      REAL_ORDER: "false"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare state directory
        run: |
          mkdir -p .agent_state

      - name: Restore agent state
        uses: actions/cache/restore@v4
        with:
          path: .agent_state
          key: ai-agent-state-${{ github.run_id }}
          restore-keys: |
            ai-agent-state-

      - name: Validate Python syntax
        run: |
          python -m py_compile agent_runtime.py
          python -m py_compile heartbeat.py
          python -m py_compile app.py

      - name: Run heartbeat
        run: |
          python heartbeat.py

      - name: Save agent state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .agent_state
          key: ai-agent-state-${{ github.run_id }}

      - name: Commit trade journal
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- TRADE_JOURNAL.md; then
            echo "TRADE_JOURNAL.md unchanged"
          else
            git add TRADE_JOURNAL.md
            git commit -m "Update trade journal"
            git push
          fi
