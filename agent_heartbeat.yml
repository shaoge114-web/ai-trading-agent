name: AI Trading Agent Heartbeat

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-trading-agent-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Prepare state directory
        run: |
          mkdir -p .agent_state

      - name: Restore agent state
        id: restore-state
        uses: actions/cache@v4
        with:
          path: .agent_state
          key: ai-agent-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ai-agent-state-${{ github.ref_name }}-

      - name: Run AI Trading Agent
        env:
          PAPER_TRADING: "true"
          REAL_ORDER: "false"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from app import agent
          from OKX_LIVE_CANDLES_REFERENCE import get_okx_live_candles
          from agent_runtime import calculate_verified_features

          STATE_PATH = Path(".agent_state/state.json")

          print("=" * 70)
          print("AI TRADING AGENT - LIVE HEARTBEAT")
          print("=" * 70)

          # ----------------------------------------------------------
          # RESTORE STATE
          # ----------------------------------------------------------

          if STATE_PATH.exists():
              with open(STATE_PATH, "r", encoding="utf-8") as f:
                  saved = json.load(f)

              saved_agent = saved.get("agent", {})

              agent.status = saved_agent.get("status", "READY")
              agent.position = saved_agent.get("position")
              agent.last_signal = saved_agent.get("last_signal")
              agent.last_decision = saved_agent.get("last_decision")
              agent.last_timestamp = saved_agent.get("last_timestamp")

              print("STATE: RESTORED")
              print("STATUS:", agent.status)
              print("POSITION:", agent.position)
              print("LAST TIMESTAMP:", agent.last_timestamp)

          else:
              print("STATE: NEW")

          # ----------------------------------------------------------
          # LIVE MARKET DATA
          # ----------------------------------------------------------

          candles = get_okx_live_candles()

          # Only confirmed/closed candles are allowed.
          confirmed = candles[
              candles["confirm"].astype(str) == "1"
          ].copy()

          if confirmed.empty:
              raise RuntimeError("No confirmed candles available")

          features = calculate_verified_features(confirmed)

          # ----------------------------------------------------------
          # FIND UNPROCESSED CONFIRMED CANDLES
          # ----------------------------------------------------------

          last_timestamp = agent.last_timestamp

          if last_timestamp is None:
              pending = features.copy()
              print("PROCESS MODE: INITIAL")
          else:
              previous_ts = str(last_timestamp)

              pending = features[
                  features["timestamp"].astype(str) > previous_ts
              ].copy()

              print("PROCESS MODE: INCREMENTAL")

          if pending.empty:
              latest = features.iloc[-1]

              print("MARKET: BTC-USDT")
              print("TIMEFRAME: 15m")
              print("LATEST CONFIRMED CANDLE:", str(latest["timestamp"]))
              print("CLOSE:", latest["close"])

              print("-" * 70)
              print("CANDLE STATUS: NO NEW CONFIRMED CANDLE")
              print("ACTION: WAIT")
              print("-" * 70)

          else:
              print("MARKET: BTC-USDT")
              print("TIMEFRAME: 15m")
              print("PENDING CONFIRMED CANDLES:", len(pending))

              # ------------------------------------------------------
              # PROCESS EVERY MISSED CONFIRMED CANDLE SEQUENTIALLY
              # ------------------------------------------------------

              for _, row in pending.iterrows():

                  current_timestamp = str(row["timestamp"])

                  print("-" * 70)
                  print("PROCESSING CONFIRMED CANDLE")
                  print("TIMESTAMP:", current_timestamp)
                  print("CLOSE:", row["close"])
                  print("-" * 70)

                  result = agent.process_feature_row(row.to_dict())

                  print("AGENT RESULT")
                  print(json.dumps(
                      result,
                      indent=2,
                      default=str
                  ))

                  # --------------------------------------------------
                  # If a position closes, continue processing the
                  # remaining confirmed candles so the agent can
                  # detect a new valid entry afterward.
                  # --------------------------------------------------

          # ----------------------------------------------------------
          # SAVE STATE
          # ----------------------------------------------------------

          state_payload = {
              "version": 3,
              "agent": agent.export_state(),
          }

          with open(STATE_PATH, "w", encoding="utf-8") as f:
              json.dump(
                  state_payload,
                  f,
                  indent=2,
                  ensure_ascii=False,
                  default=str,
              )

          print("=" * 70)
          print("STATE SAVED")
          print("=" * 70)

          print(json.dumps(
              state_payload,
              indent=2,
              default=str
          ))

          print("=" * 70)
          print("HEARTBEAT COMPLETE")
          print("=" * 70)
          PY
